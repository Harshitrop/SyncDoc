<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncDoc - Collaborative AST Engine (Ultra-Premium Edition)</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            themeBg: '#090d16',
            panelBg: 'rgba(15, 23, 42, 0.85)',
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; }
    h1, h2, h3, h4, .font-heading { font-family: 'Outfit', sans-serif; }
    code, pre, .font-mono { font-family: 'Fira Code', monospace; }
    
    /* Theme Presets */
    .theme-violet {
      --bg-main: #0b0914;
      --panel-bg: rgba(20, 16, 38, 0.85);
      --border-color: rgba(139, 92, 246, 0.2);
      --accent-glow: rgba(168, 85, 247, 0.4);
    }
    .theme-gold {
      --bg-main: #0c0a06;
      --panel-bg: rgba(28, 22, 12, 0.85);
      --border-color: rgba(245, 158, 11, 0.25);
      --accent-glow: rgba(245, 158, 11, 0.4);
    }
    .theme-light {
      --bg-main: #f8fafc;
      --panel-bg: rgba(255, 255, 255, 0.9);
      --border-color: rgba(203, 213, 225, 0.8);
      --accent-glow: rgba(99, 102, 241, 0.2);
    }

    .glass-panel {
      background: var(--panel-bg, rgba(15, 23, 42, 0.85));
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color, rgba(255, 255, 255, 0.08));
    }

    .glow-active {
      box-shadow: 0 0 20px var(--accent-glow, rgba(168, 85, 247, 0.4));
    }
    .glow-border-amber {
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.35);
      border-color: rgba(245, 158, 11, 0.7) !important;
    }
    .glow-border-purple {
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.35);
      border-color: rgba(168, 85, 247, 0.7) !important;
    }
  </style>
</head>
<body class="theme-violet bg-[#0b0914] text-slate-100 antialiased overflow-hidden selection:bg-purple-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_DOC = {
      id: 'doc-sync-spec-2026',
      title: 'SyncDoc: Collaborative AST Engine Technical Spec v2.4',
      version: 48,
      rootId: 'root-node-00',
      nodes: [
        { id: 'node-h1', type: 'heading', level: 1, content: 'SyncDoc Architecture & AST Conflict Resolution Matrix', version: 4, lastModifiedBy: 'Alex Chen (Frontend Lead)' },
        { id: 'node-callout-1', type: 'callout', variant: 'info', content: '🚀 SyncDoc engine guarantees zero-overwrite collaborative editing by resolving structural diffs at the Abstract Syntax Tree (AST) node level.', version: 6, lastModifiedBy: 'Alex Chen' },
        { id: 'node-p1', type: 'paragraph', content: 'Multi-user text editors frequently suffer from destructive overwrites and sync conflicts. Plain text merging is insufficient for complex structural documents, leading to lost work when multiple users edit simultaneously.', version: 14, lastModifiedBy: 'Sarah Lin' },
        { id: 'node-code-1', type: 'code', language: 'typescript', content: `// Yjs WebSocket Matrix Routing & AST Node Diffing\nimport { YDoc, YMap } from 'yjs';\n\nexport class ASTSyncEngine {\n  private doc = new YDoc();\n  public applyDelta(nodeId: string, patch: any): void {\n    // Atomic AST Node mutation\n  }\n}`, version: 9, lastModifiedBy: 'Dave Miller', lockedBy: 'usr-backend-1' },
        { id: 'node-callout-warning', type: 'callout', variant: 'warning', content: '⚡ Visual Block-State Indicator: Block #node-code-1 is currently being modified by Dave Miller (Backend Architect). Remote lock active.', version: 3, lastModifiedBy: 'Dave Miller' },
        { id: 'node-table-1', type: 'table', content: 'Performance Benchmark Across 10 Concurrent Clients', tableData: [ ['Sync Engine', 'Conflict Loss Rate', 'Avg Latency', 'Node Re-renders'], ['Plain Text Sync', '14.2%', '145 ms', 'Full Area Rebuild'], ['SyncDoc Yjs AST Matrix', '0.00%', '11.8 ms', 'Targeted Atomic Node'] ], version: 5, lastModifiedBy: 'Sarah Lin' },
        { id: 'node-task-1', type: 'task', content: 'Sprint Milestones (Week 1 to Week 2)', children: [ { id: 't1', content: 'Week 1: Editor Foundations & Atomic Block Rendering', checked: true }, { id: 't2', content: 'Week 2: Yjs WebSocket Routing & Presence Lock Indicators', checked: true }, { id: 't3', content: 'Mid-Project Review: Live Network Delta Tracking & Dual Simulator', checked: true } ], version: 4, lastModifiedBy: 'Alex Chen' },
        { id: 'node-math-1', type: 'math', formula: 'CRDT_Convergence(S_1, S_2) = \\lim_{t \\to \\infty} (A_t \\oplus B_t) = \\text{AST}_{unified}', content: 'Conflict-Free State Convergence Formula', version: 2, lastModifiedBy: 'Dave Miller' }
      ]
    };

    const COLLABORATORS = [
      { id: 'usr-lead-frontend', name: 'Alex Chen (You)', role: 'Frontend Lead', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80', color: '#a855f7', activeBlockId: 'node-h1', isOnline: true },
      { id: 'usr-backend-1', name: 'Dave Miller', role: 'Backend Architect', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80', color: '#f59e0b', activeBlockId: 'node-code-1', isOnline: true, isTyping: true },
      { id: 'usr-frontend-2', name: 'Sarah Lin', role: 'UI Developer', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80', color: '#10b981', activeBlockId: 'node-p1', isOnline: true }
    ];

    function SyncDocApp() {
      const [doc, setDoc] = useState(INITIAL_DOC);
      const [activeNodeId, setActiveNodeId] = useState('node-h1');
      const [activeView, setActiveView] = useState('editor');
      const [isSplitView, setIsSplitView] = useState(false);
      const [currentTheme, setCurrentTheme] = useState('theme-violet');
      const [filterType, setFilterType] = useState('all');

      const changeTheme = (themeClass) => {
        setCurrentTheme(themeClass);
        document.body.className = `${themeClass} ${themeClass === 'theme-light' ? 'light text-slate-900 bg-slate-100' : 'dark text-slate-100 bg-[#0b0914]'}`;
      };

      const handleUpdateContent = (nodeId, newContent) => {
        setDoc(prev => ({
          ...prev,
          version: prev.version + 1,
          nodes: prev.nodes.map(n => n.id === nodeId ? { ...n, content: newContent, version: n.version + 1 } : n)
        }));
      };

      const handleSimulateConflict = () => {
        alert('⚡ AST Conflict Resolution Triggered!\nSimulating concurrent edits between User A & User B.\nZero data loss merge applied successfully (Clock: v1049).');
      };

      const filteredNodes = doc.nodes.filter(n => filterType === 'all' || n.type === filterType);

      return (
        <div className="h-screen w-screen flex flex-col overflow-hidden">
          {/* Header Bar */}
          <header className="h-16 px-6 glass-panel flex items-center justify-between sticky top-0 z-30 shadow-2xl">
            {/* Title & Brand */}
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 via-pink-600 to-amber-500 flex items-center justify-center font-extrabold text-white text-lg shadow-lg shadow-purple-500/30">
                ⚡
              </div>
              <div>
                <div className="flex items-center space-x-2">
                  <span className="font-heading font-extrabold text-xl text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-300 to-amber-300 tracking-tight">
                    SyncDoc
                  </span>
                  <span className="px-2.5 py-0.5 text-[10px] font-mono font-bold bg-purple-950/80 text-purple-300 border border-purple-500/40 rounded-full">
                    AST v{doc.version}
                  </span>
                </div>
                <p className="text-xs text-slate-400 font-medium truncate max-w-[280px]">{doc.title}</p>
              </div>
            </div>

            {/* View Switcher Tabs */}
            <div className="flex items-center space-x-1 p-1 bg-slate-900/90 rounded-2xl border border-purple-500/20 text-xs font-semibold">
              <button
                onClick={() => { setActiveView('editor'); setIsSplitView(false); }}
                className={`px-3.5 py-1.5 rounded-xl transition-all ${activeView === 'editor' && !isSplitView ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold shadow-lg' : 'text-slate-400 hover:text-slate-200'}`}
              >
                📄 AST Editor
              </button>
              <button
                onClick={() => { setActiveView('ast'); setIsSplitView(false); }}
                className={`px-3.5 py-1.5 rounded-xl transition-all ${activeView === 'ast' ? 'bg-gradient-to-r from-violet-600 to-purple-600 text-white font-bold shadow-lg' : 'text-slate-400 hover:text-slate-200'}`}
              >
                🕸️ AST Node Graph
              </button>
              <button
                onClick={() => { setActiveView('crdt'); setIsSplitView(false); }}
                className={`px-3.5 py-1.5 rounded-xl transition-all ${activeView === 'crdt' ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold shadow-lg' : 'text-slate-400 hover:text-slate-200'}`}
              >
                📊 CRDT Matrix Log
              </button>
            </div>

            {/* Actions & Theme Selector */}
            <div className="flex items-center space-x-3">
              {/* Active Collaborators */}
              <div className="flex items-center -space-x-2">
                {COLLABORATORS.map(u => (
                  <img key={u.id} src={u.avatar} title={`${u.name} (${u.role})`} className="w-8 h-8 rounded-full border-2 object-cover transition-transform hover:scale-110" style={{ borderColor: u.color }} />
                ))}
              </div>

              {/* Theme Switcher Dropdown */}
              <div className="flex items-center space-x-1 bg-slate-900/80 p-1 rounded-xl border border-slate-800 text-xs">
                <button
                  onClick={() => changeTheme('theme-violet')}
                  className={`px-2 py-1 rounded-lg text-[10px] font-bold ${currentTheme === 'theme-violet' ? 'bg-purple-600 text-white' : 'text-purple-400 hover:bg-slate-800'}`}
                >
                  🔮 Violet
                </button>
                <button
                  onClick={() => changeTheme('theme-gold')}
                  className={`px-2 py-1 rounded-lg text-[10px] font-bold ${currentTheme === 'theme-gold' ? 'bg-amber-500 text-slate-950' : 'text-amber-400 hover:bg-slate-800'}`}
                >
                  👑 Gold
                </button>
                <button
                  onClick={() => changeTheme('theme-light')}
                  className={`px-2 py-1 rounded-lg text-[10px] font-bold ${currentTheme === 'theme-light' ? 'bg-slate-200 text-slate-950 font-bold' : 'text-slate-300 hover:bg-slate-800'}`}
                >
                  ☀️ Light
                </button>
              </div>

              {/* Dual Simulator */}
              <button
                onClick={() => setIsSplitView(!isSplitView)}
                className={`px-3.5 py-1.5 rounded-xl border text-xs font-bold transition-all ${isSplitView ? 'bg-purple-600 text-white border-purple-400 shadow-lg glow-active' : 'bg-slate-900 text-slate-300 border-slate-800 hover:bg-slate-800'}`}
              >
                🔀 Dual Simulator
              </button>

              {/* Conflict Button */}
              <button
                onClick={handleSimulateConflict}
                className="px-4 py-1.5 rounded-xl bg-gradient-to-r from-amber-500 via-orange-500 to-pink-600 text-slate-950 font-extrabold text-xs shadow-xl hover:brightness-110 transition-all active:scale-95"
              >
                ⚡ Simulate Conflict
              </button>
            </div>
          </header>

          {/* Main Layout Area */}
          <div className="flex-1 flex overflow-hidden">
            {/* Sidebar Dashboard */}
            <aside className="w-64 glass-panel border-r p-4 space-y-6 hidden md:flex flex-col justify-between">
              <div className="space-y-4">
                <span className="text-xs font-bold uppercase tracking-wider text-purple-400">Workspace Docs</span>
                <div className="p-3 rounded-2xl bg-gradient-to-r from-purple-950/60 to-slate-900 border border-purple-500/40 text-purple-200 text-xs font-bold shadow-md flex items-center space-x-2">
                  <span>📄</span>
                  <span className="truncate">SyncDoc Architecture Spec</span>
                </div>
              </div>

              {/* Telemetry Box */}
              <div className="p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 text-xs space-y-2.5 shadow-xl">
                <div className="flex justify-between items-center"><span className="text-slate-400 font-medium">Vector Clock:</span> <span className="font-mono text-purple-400 font-extrabold text-sm">v1048</span></div>
                <div className="flex justify-between items-center"><span className="text-slate-400 font-medium">Conflict Loss:</span> <span className="font-mono text-emerald-400 font-extrabold text-sm">0.00%</span></div>
                <div className="flex justify-between items-center"><span className="text-slate-400 font-medium">Engine:</span> <span className="text-pink-400 font-bold text-[11px]">Yjs CRDT Matrix</span></div>
                <div className="pt-2 border-t border-slate-800 flex justify-between items-center text-[10px] text-slate-500">
                  <span>WebSocket Active</span>
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                </div>
              </div>
            </aside>

            {/* Main Canvas */}
            <main className="flex-1 overflow-y-auto p-6">
              {isSplitView ? (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 h-full">
                  {/* User A Window */}
                  <div className="p-5 rounded-3xl glass-panel border border-purple-500/40 space-y-4 shadow-2xl">
                    <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                      <div className="flex items-center space-x-2">
                        <span className="w-3 h-3 rounded-full bg-purple-400 animate-ping"></span>
                        <span className="text-xs font-extrabold text-purple-300">User A: Alex Chen (Frontend Lead)</span>
                      </div>
                      <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-purple-950 text-purple-400 border border-purple-800">Live Sync</span>
                    </div>

                    {doc.nodes.map(node => (
                      <div key={node.id} className="p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800 text-xs space-y-1">
                        <div className="flex justify-between font-mono text-[10px]"><span className="text-purple-400 font-bold uppercase">{node.type}</span><span>v{node.version}</span></div>
                        <p className="text-slate-200 leading-relaxed">{node.content}</p>
                      </div>
                    ))}
                  </div>

                  {/* User B Window */}
                  <div className="p-5 rounded-3xl glass-panel border border-amber-500/40 space-y-4 shadow-2xl">
                    <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                      <div className="flex items-center space-x-2">
                        <span className="w-3 h-3 rounded-full bg-amber-400 animate-ping"></span>
                        <span className="text-xs font-extrabold text-amber-300">User B: Dave Miller (Backend Architect)</span>
                      </div>
                      <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-amber-950 text-amber-400 border border-amber-800">Live Lock</span>
                    </div>

                    {doc.nodes.map(node => (
                      <div key={node.id} className="p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800 text-xs space-y-1">
                        <div className="flex justify-between font-mono text-[10px]"><span className="text-amber-400 font-bold uppercase">{node.type}</span><span>v{node.version}</span></div>
                        <p className="text-slate-200 leading-relaxed">{node.content}</p>
                      </div>
                    ))}
                  </div>
                </div>
              ) : activeView === 'editor' ? (
                <div className="max-w-4xl mx-auto space-y-4">
                  {doc.nodes.map(node => {
                    const isLocked = node.id === 'node-code-1';
                    return (
                      <div
                        key={node.id}
                        onClick={() => setActiveNodeId(node.id)}
                        className={`p-5 rounded-3xl border relative transition-all duration-200 shadow-xl ${
                          isLocked
                            ? 'bg-slate-900/90 border-2 glow-border-amber ring-2 ring-amber-500/20'
                            : activeNodeId === node.id
                            ? 'bg-slate-900/80 border-purple-500/60 glow-border-purple ring-2 ring-purple-500/20'
                            : 'bg-slate-900/50 border-slate-800/80 hover:border-slate-700'
                        }`}
                      >
                        {/* Remote Lock Indicator */}
                        {isLocked && (
                          <div className="absolute -top-3 right-5 px-3 py-1 rounded-full bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 text-[11px] font-extrabold shadow-xl flex items-center space-x-1 animate-bounce">
                            <span>🔒 Dave Miller is editing...</span>
                          </div>
                        )}

                        <div className="flex justify-between text-[10px] font-mono text-slate-400 mb-2">
                          <span className="uppercase text-purple-400 font-extrabold tracking-wider bg-purple-950/80 px-2 py-0.5 rounded border border-purple-800">{node.type}</span>
                          <span>v{node.version} • by {node.lastModifiedBy}</span>
                        </div>

                        {node.type === 'heading' ? (
                          <h2 className="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-white via-purple-100 to-pink-300">{node.content}</h2>
                        ) : node.type === 'code' ? (
                          <div className="rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 p-4 font-mono text-xs text-purple-200">
                            <pre>{node.content}</pre>
                          </div>
                        ) : node.type === 'callout' ? (
                          <div className="p-4 rounded-2xl bg-gradient-to-r from-purple-950/60 to-pink-950/60 border border-purple-500/30 text-purple-200 text-sm leading-relaxed">
                            {node.content}
                          </div>
                        ) : (
                          <textarea
                            value={node.content}
                            onChange={(e) => handleUpdateContent(node.id, e.target.value)}
                            className="w-full bg-transparent text-slate-200 text-sm md:text-base leading-relaxed focus:outline-none resize-none"
                            rows={2}
                          />
                        )}
                      </div>
                    );
                  })}
                </div>
              ) : activeView === 'ast' ? (
                <div className="space-y-6">
                  <div className="flex justify-between items-center glass-panel p-4 rounded-2xl border border-slate-800">
                    <h3 className="font-extrabold text-base text-white">Live 2D AST Node Visualizer Graph</h3>
                    <div className="flex space-x-1.5">
                      {['all', 'heading', 'paragraph', 'code', 'callout', 'table', 'task'].map(t => (
                        <button key={t} onClick={() => setFilterType(t)} className={`px-3 py-1 rounded-xl text-xs font-bold capitalize ${filterType === t ? 'bg-purple-600 text-white shadow-lg' : 'bg-slate-900 text-slate-400 border border-slate-800'}`}>{t}</button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {filteredNodes.map(node => (
                      <div key={node.id} className="p-4 rounded-2xl bg-slate-900 border border-purple-500/20 space-y-2.5 shadow-xl hover:border-purple-500/50 transition-all">
                        <div className="flex justify-between text-[10px] font-mono"><span className="text-purple-400 font-bold uppercase bg-purple-950 px-2 py-0.5 rounded border border-purple-800">{node.type}</span><span className="text-slate-400">v{node.version}</span></div>
                        <div className="text-xs font-mono text-pink-300 font-bold">#{node.id}</div>
                        <p className="text-xs text-slate-300 line-clamp-2 leading-relaxed">{node.content}</p>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <div className="space-y-3 font-mono text-xs">
                  <div className="p-4 rounded-2xl bg-slate-900 border border-purple-500/30 text-emerald-400 font-bold shadow-xl">
                    Yjs CRDT Network Delta Logs - Operational Vector Clock v1048
                  </div>
                  <div className="p-4 rounded-2xl bg-slate-900/80 border border-slate-800 text-slate-200">11:04:10 - Dave Miller: Acquired edit lock on #node-code-1 (Clock: v1048)</div>
                  <div className="p-4 rounded-2xl bg-slate-900/80 border border-slate-800 text-slate-200">11:01:45 - Sarah Lin: Mutated text block node #node-p1 (Clock: v1045)</div>
                  <div className="p-4 rounded-2xl bg-slate-900/80 border border-slate-800 text-slate-200">11:00:12 - Alex Chen: StateVector exchange (Clock: v1042)</div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SyncDocApp />);
  </script>
</body>
</html>
